# ─────────────────────────────────────────────────────────────────────────────
#  CONFIGURAÇÕES GERAIS DO SITE
#  Edite os valores à direita dos dois-pontos. Mantenha as aspas e o recuo.
#  Linhas que começam com # são comentários (o site ignora).
# ─────────────────────────────────────────────────────────────────────────────

nome: "Tutora"
slogan: "cursos de formação humana"
descricao: "Cursos de formação humana: história, filosofia, literatura, direito e educação, com professores de referência."

# Contato e redes (deixe "" para esconder)
contato:
  email: "contato@tutoracursos.com.br"
  instagram: "https://instagram.com/tutoracursos"
  youtube: "https://youtube.com/@tutoracursos"
  facebook: ""

# Textos da página inicial
home:
  titulo_regular: "Cursos de"
  titulo_destaque: "formação humana."
  subtitulo: "História, filosofia, literatura, direito e educação em aulas com professores de referência: para entender o mundo, pensar com clareza e crescer como pessoa."

# Carrossel do topo da home ("Em destaque"). A cada visita, o site sorteia os cursos.
# Para quem já andou pelo site, o sorteio puxa para os cursos, áreas e professores que a pessoa mais viu
# e para o resultado do "Descubra seu curso" (esses aparecem como "Para você"). Isso fica só no navegador
# da pessoa: nada é enviado. Cursos com destaque_home: true têm mais chance de sair no sorteio.
vitrine:
  quantidade: 6
  # Para fixar cursos no começo do carrossel (um lançamento, uma campanha), ponha os slugs aqui, na ordem.
  # Exemplo:  fixos: ["dante-e-a-literatura"]
  fixos: []
  # false = só o sorteio, sem olhar o que a pessoa já viu
  personalizar: true

# Áreas do catálogo. O campo "area" de cada curso precisa ser igual a um destes nomes.
areas:
  - nome: "Educação dos Filhos"
    slug: "educacao-dos-filhos"
    descricao: "Princípios e práticas para educar com clareza, firmeza e afeto."
  - nome: "Família e Casamento"
    slug: "familia-e-casamento"
    descricao: "Para cuidar do laço mais importante da vida."
  - nome: "Filosofia e Formação do Juízo"
    slug: "filosofia-e-formacao-do-juizo"
    descricao: "Pensar bem é o primeiro passo para viver bem."
  - nome: "Literatura e Cultura"
    slug: "literatura-e-cultura"
    descricao: "As grandes obras e o imaginário que formaram o Ocidente."
  - nome: "História e Política"
    slug: "historia-e-politica"
    descricao: "Compreender o passado para agir no presente."
  - nome: "Direito e Vida Pública"
    slug: "direito-e-vida-publica"
    descricao: "A tradição jurídica e a vida em sociedade."

# Trilhas: sequências de cursos que fazem sentido em ordem (aparecem como fileiras na home).
trilhas:
  - titulo: "Trilha de História: da Grécia ao século XX"
    descricao: "Treze cursos em ordem cronológica para enxergar a história do Ocidente de ponta a ponta."
    cursos:
      - gregos-fundamento-do-ocidente
      - roma
      - imperio-bizantino
      - os-francos-e-o-nascimento-da-cristandade
      - alta-idade-media
      - baixa-idade-media
      - renascimento
      - mercantilismo
      - revolucoes-burguesas
      - revolucao-francesa
      - era-napoleonica
      - o-grande-seculo-xix
      - inicio-seculo-xx-guerra-e-revolucao

# O que aparece nos cartões de compra (preços e links ficam em precos.csv)
oferta:
  avulso_titulo: "Curso avulso"
  avulso_itens:
    - "Todas as aulas deste curso em vídeo"
    - "7 dias de garantia"
    - "Compra segura pela Hotmart"
  # Cartão do combo (ex.: Um Passeio pela História), nos cursos que fazem parte dele
  combo_itens:
    - "7 dias de garantia"
    - "Compra segura pela Hotmart"
  acesso_titulo: "Acesso Completo"
  acesso_itens:
    - "Acesso a todos os cursos do catálogo"
    - "Plano anual: renova até você cancelar"
    - "7 dias de garantia"
    - "Compra segura pela Hotmart"
  # Enquanto um curso (ou o Acesso Completo) não tiver link da Hotmart no precos.csv:
  texto_sem_link: "Inscrições em breve"
  texto_espera: "As inscrições ainda não abriram. Se quiser, avisamos você quando abrirem."
  texto_aviso: "Avise-me quando abrir"
  # Para onde vai o botão "Avise-me": um link de WhatsApp, de formulário etc.
  # Se ficar "", o botão abre um e-mail para o endereço de contato acima.
  link_aviso: ""

# Planilha "Meus leads": guarda as respostas de quem faz o "Descubra seu curso"
# (e o nome e o e-mail, quando a pessoa quiser deixar). Como ligar: LEIA-ME, seção "Meus leads".
# Enquanto link_planilha ficar "", o site não pede nome/e-mail e não envia nada.
leads:
  link_planilha: ""
  titulo: "Quer receber novidades da Tutora?"
  texto: "Opcional: deixe seu nome e e-mail para receber sugestões de cursos e novidades. Dá para cancelar quando quiser."
  aviso: "Usamos seus dados só para falar com você sobre os cursos da Tutora."
